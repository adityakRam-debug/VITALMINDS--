spring.application.name=VitalMinds-V7
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/vitalminds?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

vitalminds.upload-dir=uploads

# V7 AI Assistant (optional). Keep the API key in an environment variable.
vitalminds.ai.enabled=${VITALMINDS_AI_ENABLED:false}
vitalminds.ai.api-key=${OPENAI_API_KEY:}
vitalminds.ai.model=${VITALMINDS_AI_MODEL:gpt-5-mini}
vitalminds.ai.base-url=${VITALMINDS_AI_BASE_URL:https://api.openai.com/v1/chat/completions}

# V7 OCR for scanned PDFs. Install Tesseract separately on macOS: brew install tesseract
vitalminds.ocr.enabled=${VITALMINDS_OCR_ENABLED:true}
vitalminds.ocr.command=${TESSERACT_COMMAND:tesseract}
