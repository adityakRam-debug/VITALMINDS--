<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VitalMinds | Register</title><link rel="stylesheet" href="/app.css"></head><body class="auth-body"><div class="auth-shell"><div class="auth-art"><div class="brand light"><span class="brand-mark">✦</span><div><b>VitalMinds</b><small>health, simplified</small></div></div><div class="art-copy"><span class="eyebrow">START YOUR JOURNEY</span><h1>A calmer way to<br><em>track your wellbeing.</em></h1><p>Create your profile today and gradually build your personal health timeline.</p><div class="orb">✚</div></div></div><div class="auth-form"><span class="eyebrow">GET STARTED</span><h2>Create account</h2><p>It takes less than a minute.</p><div th:if="${error}" class="toast error" th:text="${error}">Error</div><form action="/api/register" method="post"><label>Full name<input name="name" placeholder="Your name" required></label><label>Email<input type="email" name="email" placeholder="you@example.com" required></label><label>Password<input type="password" name="password" minlength="6" placeholder="At least 6 characters" required></label><button class="primary full" type="submit">Create account</button></form><p class="switch">Already have an account? <a href="/login">Sign in</a></p></div></div></body></html>
