<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VitalMinds • Admin</title><link rel="stylesheet" href="/app.css"></head><body><header class="topbar"><a class="brand" href="/dashboard"><span>✦</span> VitalMinds</a><a class="ghost-btn" href="/dashboard">Back to dashboard</a></header><main class="container"><section class="hero"><div><p class="eyebrow">ADMIN CONSOLE</p><h1>VitalMinds overview</h1><p>System-level statistics for your project demonstration.</p></div></section><section class="grid four"><article class="metric"><span>👥</span><small>Users</small><b th:text="${userCount}">0</b></article><article class="metric"><span>📄</span><small>Reports</small><b th:text="${reportCount}">0</b></article><article class="metric"><span>🚨</span><small>Alerts</small><b th:text="${alertCount}">0</b></article><article class="metric"><span>🛡️</span><small>Access</small><b>ADMIN</b></article></section><section class="panel"><div class="panel-head"><div><h2>Registered users</h2><p>Use this page only for authorized administration.</p></div></div><div class="report" th:each="u:${users}"><div><b th:text="${u.name}">User</b><span th:text="${u.email}">email</span></div><span class="pill" th:text="${u.role}">USER</span></div></section></main></body></html>
